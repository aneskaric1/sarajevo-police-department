<div class="tape"></div>
<div class="container d-flex align-items-center justify-content-center auth-wrap py-5">
  <div class="auth-card p-4 p-md-5">
    <h1 class="h2 mb-1">Officer login</h1>
    <p class="text-secondary">Sign in to manage incidents, tickets and records.</p>
    <div id="login-error" class="alert alert-danger d-none" role="alert">Email or password is wrong. Check both and try again.</div>
    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="login-email" class="form-label">Email</label>
        <input type="email" class="form-control" id="login-email" name="email" autocomplete="username" required>
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" name="password" autocomplete="current-password" required>
        <div class="invalid-feedback">Enter your password.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
    <hr>
    <p class="small text-secondary mb-2">Demo accounts (Milestone 1 only):</p>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" data-fill="0">Fill in admin</button>
      <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" data-fill="1">Fill in officer</button>
    </div>
    <p class="small mt-3 mb-0">No account yet? <a href="#/register">Register</a></p>
  </div>
</div>
