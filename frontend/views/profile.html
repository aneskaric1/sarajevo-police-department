<div class="row g-3">
  <div class="col-12 col-lg-4">
    <div class="panel p-4 text-center">
      <i class="bi bi-person-circle display-3"></i>
      <h2 class="h4 mt-2 mb-0">Your account</h2>
      <p class="text-secondary mb-0">Details for the signed-in officer</p>
    </div>
  </div>
  <div class="col-12 col-lg-8">
    <div class="panel">
      <div class="panel-head"><h2>Profile</h2></div>
      <form class="p-3" data-demo-form="Profile saved" novalidate>
        <div class="row g-3">
          <div class="col-md-6"><label for="pf-first" class="form-label">First name</label><input class="form-control" id="pf-first" value="Emir" required></div>
          <div class="col-md-6"><label for="pf-last" class="form-label">Last name</label><input class="form-control" id="pf-last" value="Kovac" required></div>
          <div class="col-md-6"><label for="pf-badge" class="form-label">Badge number</label><input class="form-control" id="pf-badge" value="P-214" disabled></div>
          <div class="col-md-6"><label for="pf-email" class="form-label">Email</label><input type="email" class="form-control" id="pf-email" value="officer@spd.test" required></div>
          <div class="col-md-6"><label for="pf-pass" class="form-label">New password</label><input type="password" class="form-control" id="pf-pass" minlength="8" autocomplete="new-password"></div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Save profile</button>
      </form>
    </div>
  </div>
</div>
