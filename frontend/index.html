<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarajevo Police Department Portal</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/badge.svg">

  <!-- Libraries (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">

  <!-- Our theme -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-role="guest">

  <!-- PUBLIC LAYOUT: home, login, register -->
  <div id="public-layout">
    <nav class="navbar navbar-expand-md navbar-dark mpd-navbar">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#/home">
          <img src="assets/img/badge.svg" alt="" width="34" height="34">
          <span>Sarajevo Police Department</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav"
                aria-controls="publicNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="publicNav">
          <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
            <li class="nav-item"><a class="nav-link" href="#/home" data-route="home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#/register" data-route="register">Register</a></li>
            <li class="nav-item"><a class="btn btn-warning btn-sm px-3" href="#/login">Officer login</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main id="public-view"></main>
    <footer class="mpd-footer py-4">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>&copy; 2026 Sarajevo Police Department.</span>
        <span>Emergency: <strong>112</strong> &middot; Non-emergency: +387603138785</span>
      </div>
    </footer>
  </div>

  <!-- APP LAYOUT: everything after login -->
  <div id="app-layout" class="d-none">
    <div class="d-flex">
      <aside class="offcanvas-lg offcanvas-start mpd-sidebar" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="sidebarLabel">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-0">
          <a class="sidebar-brand d-none d-lg-flex align-items-center gap-2" href="#/dashboard">
            <img src="assets/img/badge.svg" alt="" width="34" height="34"><span>SPD Portal</span>
          </a>
          <nav class="nav flex-column sidebar-nav" aria-label="Main">
            <a class="nav-link" href="#/dashboard" data-route="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a class="nav-link" href="#/incidents" data-route="incidents"><i class="bi bi-exclamation-triangle"></i> Incidents</a>
            <a class="nav-link" href="#/tickets" data-route="tickets"><i class="bi bi-receipt"></i> Tickets</a>
            <a class="nav-link" href="#/citizens" data-route="citizens"><i class="bi bi-people"></i> Citizens</a>
            <a class="nav-link" href="#/vehicles" data-route="vehicles"><i class="bi bi-car-front"></i> Vehicles</a>
            <div class="sidebar-heading admin-only">Administration</div>
            <a class="nav-link admin-only" href="#/violations" data-route="violations"><i class="bi bi-list-check"></i> Violation types</a>
            <a class="nav-link admin-only" href="#/officers" data-route="officers"><i class="bi bi-person-badge"></i> Officers</a>
          </nav>
          <div class="mt-auto sidebar-nav">
            <a class="nav-link" href="#/profile" data-route="profile"><i class="bi bi-person-circle"></i> My profile</a>
            <a class="nav-link" href="#/home" id="logout-link"><i class="bi bi-box-arrow-left"></i> Log out</a>
          </div>
        </div>
      </aside>

      <div class="flex-grow-1 mpd-main">
        <header class="mpd-topbar d-flex align-items-center gap-3 px-3 px-lg-4">
          <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                  data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open menu">
            <i class="bi bi-list"></i>
          </button>
          <h1 class="h5 m-0" id="page-title">Dashboard</h1>
          <div class="ms-auto d-flex align-items-center gap-2">
            <span class="badge text-bg-warning" id="role-badge">user</span>
            <span class="small text-secondary d-none d-sm-inline" id="user-name"></span>
          </div>
        </header>
        <main id="app-view" class="p-3 p-lg-4"></main>
      </div>
    </div>
  </div>

  <!-- Toast shown after demo form saves -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="app-toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="app-toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Our code: loaded once, in this order -->
  <script src="services/authService.js"></script>
  <script src="utils/ui.js"></script>
  <script src="utils/router.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
